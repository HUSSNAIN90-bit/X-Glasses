name: Export YOLO26 LiteRT model

on:
  push:
    branches:
      - feature/offline-face-object-detection
    paths:
      - .github/workflows/export-yolo26-litert.yml
      - scripts/export_yolo26_litert.py
      - models/yolo26n.pt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/offline-face-object-detection
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LiteRT export dependencies
        run: python -m pip install --upgrade pip && python -m pip install "ultralytics-opencv-headless[export-litert]>=8.4.142" "ai-edge-litert>=2.3.0"
      - name: Export and smoke-test YOLO26n
        run: python scripts/export_yolo26_litert.py
      - name: Commit mobile model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/yolo26n.tflite models/yolo26n_manifest.json
          if git diff --cached --quiet; then
            echo "Model artifact is already current."
            exit 0
          fi
          git commit -m "build: publish YOLO26n LiteRT mobile model"
          git push origin HEAD:feature/offline-face-object-detection
